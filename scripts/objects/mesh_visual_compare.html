<!doctype html><meta charset="utf-8"><title>SAM 3D Objects mesh parity</title>
<style>body{margin:0;background:#10192c;color:#e6edf5;font:15px system-ui}header{padding:16px 20px}h1{font-size:22px;margin:0 0 6px}#panels{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}section{text-align:center}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap;color:#bcd0df}</style>
<header><h1>SAM 3D Objects geometry parity</h1><p>Same GLB parser, camera, lighting, material, scale, and framing. Reference: pinned upstream CUDA. Candidate: native GGML Vulkan.</p></header>
<div id="panels"><section id="reference"><h2>Upstream CUDA</h2></section><section id="candidate"><h2>Native Vulkan</h2></section></div>
<pre id="results">Rendering…</pre>
<script type="module">
import * as T from '/three.module.min.js';
const qa=window.meshVisualQA={ready:false,errors:[]};
window.addEventListener('error',event=>qa.errors.push(event.message));
window.addEventListener('unhandledrejection',event=>qa.errors.push(String(event.reason)));
function parseGLB(buffer){const view=new DataView(buffer);if(view.getUint32(0,true)!==0x46546c67||view.getUint32(4,true)!==2||view.getUint32(8,true)!==buffer.byteLength)throw Error('Invalid GLB');const jsonLength=view.getUint32(12,true),doc=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,20,jsonLength))),binStart=28+jsonLength,primitive=doc.meshes[0].primitives[0];function read(index){const a=doc.accessors[index],b=doc.bufferViews[a.bufferView],width=a.type==='VEC3'?3:1,offset=binStart+(b.byteOffset||0)+(a.byteOffset||0);if(a.componentType===5126)return new Float32Array(new Float32Array(buffer,offset,a.count*width));if(a.componentType===5125)return new Uint32Array(new Uint32Array(buffer,offset,a.count*width));throw Error('Unsupported accessor')}return {positions:read(primitive.attributes.POSITION),colors:read(primitive.attributes.COLOR_0),indices:read(primitive.indices)}}
const params=new URLSearchParams(location.search),referenceURL=params.get('reference')||'/upstream.glb',candidateURL=params.get('candidate')||'/native.glb';
const [reference,candidate]=await Promise.all([referenceURL,candidateURL].map(async path=>parseGLB(await(await fetch(path)).arrayBuffer())));
const width=512,height=512,camera=new T.PerspectiveCamera(38,1,.01,100),scenes=[],renderers=[];
const bounds=new T.Box3().setFromBufferAttribute(new T.BufferAttribute(reference.positions,3)),centre=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3()),extent=Math.max(size.x,size.y,size.z),distance=extent*.72/Math.tan(T.MathUtils.degToRad(19));
function makeScene(data,id){const scene=new T.Scene();scene.background=new T.Color('#10192c');scene.add(new T.HemisphereLight(0xcbeaff,0x384450,2.2));const light=new T.DirectionalLight(0xffffff,2.8);light.position.set(3,5,5);scene.add(light);const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.BufferAttribute(data.positions,3));geometry.setAttribute('color',new T.BufferAttribute(data.colors,3));geometry.setIndex(new T.BufferAttribute(data.indices,1));geometry.computeVertexNormals();scene.add(new T.Mesh(geometry,new T.MeshStandardMaterial({vertexColors:true,side:T.DoubleSide,roughness:1,metalness:0})));const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(width,height,false);renderer.outputColorSpace=T.SRGBColorSpace;document.getElementById(id).append(renderer.domElement);scenes.push(scene);renderers.push(renderer)}
makeScene(reference,'reference');makeScene(candidate,'candidate');
function pixels(renderer,scene){renderer.render(scene,camera);const gl=renderer.getContext(),out=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,out);if(gl.getError())throw Error('WebGL readback failed');return out}
function compare(a,b){let absolute=0,changed=0,intersection=0,union=0,oa=0,ob=0;const background=[16,25,44];for(let i=0;i<a.length;i+=4){let delta=0,da=0,db=0;for(let c=0;c<3;c++){delta+=Math.abs(a[i+c]-b[i+c]);da+=Math.abs(a[i+c]-background[c]);db+=Math.abs(b[i+c]-background[c])}absolute+=delta;changed+=delta>24;const fa=da>18,fb=db>18;oa+=fa;ob+=fb;intersection+=fa&&fb;union+=fa||fb}return {rgb_mae:absolute/(width*height*3*255),changed_pixel_fraction:changed/(width*height),silhouette_iou:intersection/union,reference_pixels:oa,candidate_pixels:ob}}
qa.setView=view=>{const azimuth=view==='side'?Math.PI/2:view==='oblique'?.4:0,elevation=view==='oblique'?.12:0;camera.position.set(centre.x+distance*Math.sin(azimuth)*Math.cos(elevation),centre.y+distance*Math.sin(elevation),centre.z+distance*Math.cos(azimuth)*Math.cos(elevation));camera.lookAt(centre);camera.updateMatrixWorld();return compare(pixels(renderers[0],scenes[0]),pixels(renderers[1],scenes[1]))};
qa.metrics={};for(const view of ['front','side','oblique'])qa.metrics[view]=qa.setView(view);qa.counts={reference:{vertices:reference.positions.length/3,faces:reference.indices.length/3},candidate:{vertices:candidate.positions.length/3,faces:candidate.indices.length/3}};qa.ready=true;document.getElementById('results').textContent=JSON.stringify({counts:qa.counts,metrics:qa.metrics,errors:qa.errors},null,2);
</script>
